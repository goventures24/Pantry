<html lang="en">
<head>

<title>Household Pantry</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#faf8f3;--card:#fff;--text:#2a2a26;--muted:#77756b;--line:#e6e2d6;--accent:#2f7d4f;--accent-t:#fff;
--low:#c98a12;--low-bg:#fbf1d9;--out:#c0392b;--out-bg:#fbe3df;--ok-bg:#e3f2e8;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1c19;--card:#262722;--text:#eeece4;--muted:#a09e92;--line:#3a3b34;--accent:#5fb882;--accent-t:#10200f;--low:#e8b84a;--low-bg:#3b3219;--out:#ef7a6c;--out-bg:#40221e;--ok-bg:#20362a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1c19;--card:#262722;--text:#eeece4;--muted:#a09e92;--line:#3a3b34;--accent:#5fb882;--accent-t:#10200f;--low:#e8b84a;--low-bg:#3b3219;--out:#ef7a6c;--out-bg:#40221e;--ok-bg:#20362a;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Sinhala","Iskoola Pota",sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:560px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.5rem;margin:0 0 2px}
.sub{color:var(--muted);margin:0 0 16px;font-size:.92rem}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{flex:1;padding:12px 10px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
.badge{display:inline-block;min-width:1.4em;padding:0 6px;border-radius:99px;background:var(--out);color:#fff;font-size:.78rem;margin-left:4px}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.f{flex:none;padding:7px 12px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--text);font:inherit;font-size:.88rem;cursor:pointer}
.f[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.add{display:flex;gap:8px;margin-bottom:10px}
.add input,.add select{padding:11px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font:inherit}
.add input{flex:1;min-width:0}
.add select{max-width:42%}
.btn{padding:10px 14px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-t);font:inherit;font-weight:600;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{padding:6px 11px;border:1px dashed var(--line);border-radius:99px;background:none;color:var(--muted);font:inherit;font-size:.85rem;cursor:pointer}
h2{font-size:.82rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 2px 8px}
.item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.name{min-width:0;overflow-wrap:anywhere;font-weight:600}
.tag{text-transform:uppercase;font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:99px}
.tag.low{background:var(--low-bg);color:var(--low)}.tag.out{background:var(--out-bg);color:var(--out)}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:none;color:var(--muted);padding:8px 10px;font:inherit;font-size:.85rem;cursor:pointer}
.seg button[aria-pressed="true"].ok{background:var(--ok-bg);color:var(--accent);font-weight:700}
.seg button[aria-pressed="true"].low{background:var(--low-bg);color:var(--low);font-weight:700}
.seg button[aria-pressed="true"].out{background:var(--out-bg);color:var(--out);font-weight:700}
.x{border:0;background:none;color:var(--muted);font-size:1.3rem;cursor:pointer;padding:4px 8px}

function t(k,a){var v=(T[lang]||T.en)[k];if(v===undefined)v=T.en[k];return typeof v==='function'?v(a):v}
function nm(n){return lang==='si'&&NS[n.toLowerCase()]||n}
function setNote(k){noteK=k;$('note').textContent=t(k)}
function applyLang(){
  document.documentElement.lang=lang;
  $('h1').textContent=t('h1');$('sub').textContent=t('sub');$('tl').textContent=t('tl');$('t-stock').textContent=t('ts');
  $('in').placeholder=t('ph');$('q').placeholder=t('search');$('addBtn').textContent=t('add');$('share').textContent=t('share');

  $('cat').value=cv;
  if(noteK)$('note').textContent=t(noteK);
}
function rid(){return 'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function cat(k){return CATS.find(function(c){return c.k===k})||CATS[0]}

function save(it){
  if(col){col.doc(it.id).set({name:it.name,status:it.status,c:it.c,t:it.t,d:it.d,b:it.b,h:it.h||[],sn:it.sn||0}).catch(function(){setNote('nsave')});}
}
function due(x){var d=(x.d||DEFD[x.c]||14),t=(x.b||x.t)+(d-Math.min(3,d*0.5))*DAY;return x.sn&&x.sn>t?x.sn:t}
function soon(x){return x.status==='ok'&&due(x)<=Date.now()}
function restock(it){
  var n=Date.now(),iv=n-(it.b||n);
  if(iv>=DAY/2){var h=(it.h||[]).concat(Math.round(iv/DAY*10)/10).slice(-5);
    it.d=Math.max(1,Math.round(h.length>=2?h.reduce(function(a,b){return a+b},0)/h.length:((it.d||14)+iv/DAY)/2));it.h=h}
  it.b=n;it.sn=0;it.status='ok';
}
function setStatus(id,s){
  var it=items.find(function(x){return x.id===id});if(!it)return;
  if(s==='ok')restock(it);else if(s==='snooze'){it.sn=Date.now()+DAY}else it.status=s;
  it.t=Date.now();save(it);render();
}
function setDur(id,v){var it=items.find(function(x){return x.id===id});v=parseInt(v,10);if(!it||!(v>0))return;it.d=Math.min(365,v);save(it);render()}
function addItem(n,c){
  n=(n||'').trim();if(!n)return;
  c=c||$('cat').value;
  if(items.some(function(x){return x.name.toLowerCase()===n.toLowerCase()&&x.c===c}))return;
  var it={id:rid(),name:n,status:'ok',c:c,t:Date.now(),b:Date.now(),d:DEF[n.toLowerCase()]||DEFD[c]||14,h:[],sn:0};
  items.push(it);save(it);render();
}
function del(id){
  items=items.filter(function(x){return x.id!==id});
  if(col)col.doc(id).delete().catch(function(){});
  render();
}
function group(list,fn){
  var h='';
  CATS.forEach(function(c){
    var g=list.filter(function(x){return x.c===c.k});
    if(!g.length)return;
    if(filt==='all')h+='<h2>'+c.e+' '+t('c_'+c.k)+'</h2>';
    g.forEach(function(x){h+=fn(x)});
  });
  return h;
}
function autoLow(){var n=Date.now();items.forEach(function(x){if(x.status==='ok'&&!(x.sn&&x.sn>n)&&n>=(x.b||x.t)+(x.d||DEFD[x.c]||14)*DAY){x.status='low';x.t=n;save(x)}})}
function render(){
  autoLow();
  applyLang();
  var need=items.filter(function(x){return x.status!=='ok'||soon(x)});$('share').hidden=!(tab==='list'&&need.length);
  var c=$('cnt');c.textContent=need.length;c.hidden=!need.length;
  $('t-list').setAttribute('aria-selected',tab==='list');$('t-stock').setAttribute('aria-selected',tab==='stock');

  CATS.forEach(function(k){fh+='<button class="f" data-f="'+k.k+'" aria-pressed="'+(filt===k.k)+'">'+k.e+' '+t('c_'+k.k)+'</button>'});
  $('filters').innerHTML=fh;
  var qq=q.trim().toLowerCase();var vis=function(x){return (filt==='all'||x.c===filt)&&(!qq||x.name.toLowerCase().indexOf(qq)>-1||nm(x.name).toLowerCase().indexOf(qq)>-1)};
  var rk=function(x){return x.status==='out'?0:x.status==='low'?1:2};var sorter=function(a,b){return rk(a)-rk(b)||a.name.localeCompare(b.name)};
  var h='';
  if(tab==='list'){
    var L=need.filter(vis).sort(sorter);
    if(!L.length)h='<div class="empty">'+t(qq?'nomatch':'emptyL')+'</div>';
    h+=group(L,function(x){var sn=x.status==='ok';return '<div class="item"><div class="nm"><span class="name">'+esc(nm(x.name))+'</span>'+(sn?'<span class="meta">'+t('pred')+'</span>':'')+'</div><span class="tag '+(sn?'soon':x.status)+'">'+t(sn?'soon':x.status)+'</span>'+(sn?'<button class="ghost" data-a="snooze" data-id="'+x.id+'">'+t('still')+'</button>':'')+'<button class="btn" data-a="ok" data-id="'+x.id+'">'+t('bought')+'</button></div>'});
  }else{
    var S=items.filter(vis).sort(function(a,b){return a.name.localeCompare(b.name)});
    if(!S.length)h='<div class="empty">'+t(qq?'nomatch':'emptyS')+'</div>';
    h+=group(S,function(x){
      function b(s,l){return '<button class="'+s+'" aria-pressed="'+(x.status===s)+'" data-a="'+s+'" data-id="'+x.id+'">'+l+'</button>'}
      var lf=(due(x)-Date.now())/DAY,m=x.status!=='ok'?t('needs'):lf<=0?t('lownow'):t('lowin',Math.ceil(lf));
      return '<div class="item"><div class="nm"><span class="name">'+esc(nm(x.name))+'</span><span class="meta">'+m+' · '+t('lasts1')+'<input class="dur" type="number" min="1" max="365" value="'+(x.d||14)+'" data-id="'+x.id+'" aria-label="Days it lasts">'+t('lasts2')+'</span></div><div class="seg">'+b('ok',t('have'))+b('low',t('low'))+b('out',t('out'))+'</div><button class="x" aria-label="Remove '+esc(nm(x.name))+'" data-a="del" data-id="'+x.id+'">×</button></div>';
    });
  }
  $('view').innerHTML=h;
  var sc=$('cat').value||'cooking';
  var have=items.filter(function(x){return x.c===sc}).map(function(x){return x.name.toLowerCase()});
  $('chips').innerHTML=(SUG[sc]||[]).filter(function(s){return have.indexOf(s.toLowerCase())<0}).map(function(s){return '<button class="chip" data-s="'+esc(s)+'">+ '+esc(nm(s))+'</button>'}).join('');
}

setNote('nconn');
